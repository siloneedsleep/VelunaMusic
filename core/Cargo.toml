[package]
name = "veluna-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "alac"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

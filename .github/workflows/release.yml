name: Release VelunaMusic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release binary
        run: cargo build --release --locked --features custom-protocol -p velunamusic
      - name: Package Windows artifact and SHA-256
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $versioned = "VelunaMusic-$tag-windows-x64.exe"
          $canonical = "VelunaMusic-Windows-x64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/velunamusic.exe" "dist/$versioned"
          Copy-Item "target/release/velunamusic.exe" "dist/$canonical"
          $hash = (Get-FileHash "dist/$versioned" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "dist/$versioned.sha256" -Value "$hash  $versioned`n"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35 and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSIONED="VelunaMusic-${RELEASE_TAG}-android.apk"
          CANONICAL="VelunaMusic-Android.apk"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            ./android/gradlew -p android --no-daemon :app:assembleRelease
            UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            ALIGNED="dist/aligned.apk"
            KEYSTORE="$(mktemp)"
            trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "dist/${VERSIONED}" \
              "$ALIGNED"
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "dist/${VERSIONED}"
          else
            ./android/gradlew -p android --no-daemon :app:assembleDebug
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "dist/${VERSIONED}"
          fi
          cp "dist/${VERSIONED}" "dist/${CANONICAL}"
          (cd dist && sha256sum "${VERSIONED}" > "${VERSIONED}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.exe *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "VelunaMusic $TAG" \
              --generate-notes
          fi

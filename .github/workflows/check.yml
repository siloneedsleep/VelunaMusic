name: Check VelunaMusic
on:
  push:
    branches: ['codex/dev']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p veluna-core
      - run: cargo build --locked -p velunamusic --release --features custom-protocol
      - run: cargo test --locked -p velunamusic --release --features custom-protocol
      - run: node --test tests/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build Rust library for Android
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          toolchain="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$toolchain/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$toolchain/x86_64-linux-android26-clang"
          for pair in aarch64-linux-android:arm64-v8a armv7-linux-androideabi:armeabi-v7a x86_64-linux-android:x86_64; do
            target="${pair%:*}"
            abi="${pair#*:}"
            cargo build --target "$target" --release --locked -p veluna-core
            install -Dm755 "target/$target/release/libveluna_core.so" "android/app/src/main/jniLibs/$abi/libveluna_core.so"
          done
      - run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify packaged native libraries and player
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do unzip -t "$apk" "lib/$abi/libveluna_core.so"; done
          for item in index.html library.js lrc.js simpmusic/poppins-regular.ttf simpmusic/GPL-3.0.txt; do unzip -t "$apk" "assets/$item"; done
      - name: Allow emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the Android player on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android --no-daemon :app:connectedDebugAndroidTest

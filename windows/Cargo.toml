[package]
name = "velunamusic"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
veluna-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json","stream"] }
sha2 = "0.10"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
open = "5"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
